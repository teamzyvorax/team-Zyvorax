services:
  - type: web
    name: team-zyvorax-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run api
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: team-zyvorax-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false

databases:
  - name: team-zyvorax-db
    plan: free
