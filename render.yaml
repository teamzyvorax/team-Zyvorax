services:
  - type: web
    name: team-zyvorax
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: team-zyvorax-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false

databases:
  - name: team-zyvorax-db
    plan: free
