name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/twa-manifest.json'
      - '.github/workflows/android.yml'
      - 'public/manifest.webmanifest'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap non-interactively
        run: |
          if [ ! -e "$ANDROID_HOME/tools" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$ANDROID_HOME"}
          EOF
          bubblewrap doctor

      - name: Generate Android project
        run: bubblewrap update --manifest=android

      - name: Create CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/ci-release.keystore \
            -alias teamzyvorax \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass changeit -keypass changeit \
            -dname "CN=Team ZyvoraX, OU=Mobile, O=Team ZyvoraX, L=Surat, ST=Gujarat, C=IN"

      - name: Build signed APK and AAB
        run: |
          export BUBBLEWRAP_KEYSTORE_PASSWORD=changeit
          export BUBBLEWRAP_KEY_PASSWORD=changeit
          bubblewrap build \
            --manifest=android \
            --signingKeyPath=android/ci-release.keystore \
            --signingKeyAlias=teamzyvorax

      - name: Collect outputs
        run: |
          mkdir -p android-artifacts
          find android -type f \( -name '*signed.apk' -o -name '*.aab' \) -print -exec cp {} android-artifacts/ \;

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: team-zyvorax-android
          path: android-artifacts/
          if-no-files-found: error
