name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: node --check server/index.js
      - run: node --check server/db.js
      - run: node --check server/platform.js
      - run: node --check server/platform-core.js
      - run: node --check src/platform.js
